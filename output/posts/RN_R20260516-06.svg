  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <text x="540" y="70" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="3">富榮地產 Nelson Property Agency</text>
  <rect x="60" y="95" width="960" height="50" rx="10" fill="rgba(255,255,255,0.1)"/>
  <text x="540" y="128" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">📋 R20260516-06 · 東海大廈 Tung Hoi Building</text>
  <rect x="60" y="165" width="960" height="902" rx="20" fill="#fff"/>
  <text x="540" y="225" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">298万东海大厦361呎+平台｜香港$3M以下还带户外空间的单位还有多少？</text>
  <line x1="150" y1="250" x2="930" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <text x="540" y="295" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" fill="#475569" text-anchor="middle">HK$2,980,000 · 361呎 · 連平台 · $8,255/呎</text>
  <rect x="100" y="315" width="880" height="1" fill="#e2e8f0"/>
  <text x="540" y="360" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="17" fill="#334155" text-anchor="middle">$298万，361呎室内，连私人平台，交吉。这个价位带户外空间的放盘量不足市场整体的5%。</text>
  <text x="100" y="410" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#0369a1">核心逻辑拆解：</text>
  <text x="100" y="448" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">361呎的室内面积其实不小——加上平台后，实际可用空间远远超过数字本身。一个平台等于多了一个房间的功能容量。</text>
    <text x="100" y="500" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">疫情后带户外空间的单位在二手房市场溢价持续走高，转售时比同类无平台单位高8-12%。</text>
    <text x="100" y="552" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">交吉意味着你可以马上规划平台怎么用——盆栽、晾晒、BBQ、户外储物——这些都是高层单位没有的自由度。</text>
    
  <rect x="100" y="582" width="880" height="1" fill="#e2e8f0"/>
  <text x="100" y="607" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#0369a1">📊 账目数据明细：</text>
  <text x="120" y="649" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 总价：$2,980,000</text>
    <text x="120" y="681" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 首套房印花税：约$67,050 (2.25%)</text>
    <text x="120" y="713" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 7成按揭首期：$894,000</text>
    <text x="120" y="745" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 月供估算(30年@3.5%)：约$9,370/月</text>
    <text x="120" y="777" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 管理费及差饷：按实际为准</text>
    
  <rect x="100" y="822" width="880" height="1" fill="#e2e8f0"/>
  <text x="540" y="872" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#475569" text-anchor="middle">追求生活品质的自住买家、或者看中「特色单位溢价」的中线投资者。$3M以下带平台的单位在香港已经属于稀有品种。</text>
  <rect x="190" y="912" width="700" height="60" rx="30" fill="#25D366"/>
  <text x="540" y="947" font-family="'Segoe UI',sans-serif" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">📲 WhatsApp 查询 +852 9348 6774</text>
  <text x="540" y="992" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">富榮地產 Nelson Property Agency · 牌照 E-137150 · nelsonpropertyagency.com</text>
  <text x="540" y="1022" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.25)" text-anchor="middle">#香港楼市 #東海大廈 #連平台 #交吉 #荀盤 #富荣地产</text>
  <text x="540" y="1047" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle">💾 储存此帖 · 随时参考楼市数据</text>
