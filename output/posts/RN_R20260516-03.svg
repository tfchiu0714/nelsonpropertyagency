  <text x="540" y="225" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">188万葵涌284呎一房兩廳｜交吉才是「真正看得见」的上车之选</text>
  <line x1="150" y1="250" x2="930" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <text x="540" y="295" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" fill="#475569" text-anchor="middle">HK$1,880,000 · 284呎 · 一房兩廳 · $6,620/呎</text>
  <rect x="100" y="315" width="880" height="1" fill="#e2e8f0"/>
  <text x="540" y="360" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="17" fill="#334155" text-anchor="middle">和不交吉的192号盘同区打对台——这边是284呎一房两厅，交吉放售，$6,620/呎。你「看得见」你要买的是什么。</text>
  <text x="100" y="410" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#0369a1">核心逻辑拆解：</text>
  <text x="100" y="448" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">一房两厅布局在284呎这个面积段相当少见——多数同面积只有开放式。多了一堵墙，意味着真正的卧室空间和噪音隔离。</text>
    <text x="100" y="500" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">交吉意味着你可以亲自量尺、规划布局、定制装修——对于自住型首次置业者是刚需优势。</text>
    <text x="100" y="552" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">葵涌租赁大盘不愁租客，将来需要放租时，同区95%出租率的数据依然成立。</text>
    
  <rect x="100" y="582" width="880" height="1" fill="#e2e8f0"/>
  <text x="100" y="607" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#0369a1">📊 账目数据明细：</text>
  <text x="120" y="649" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 总价：$1,880,000</text>
    <text x="120" y="681" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 首套房印花税：约$100</text>
    <text x="120" y="713" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 9成按揭首期：$188,000</text>
    <text x="120" y="745" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 月供估算(30年@3.5%)：约$7,600/月</text>
    <text x="120" y="777" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 呎价仅$6,620——区内最低一档</text>
    
  <rect x="100" y="822" width="880" height="1" fill="#e2e8f0"/>
  <text x="540" y="872" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#475569" text-anchor="middle">首次置业的年轻人、小家庭，希望在葵涌站稳脚跟的自住型买家。交吉保证你可以随时入住，所见即所得。</text>
