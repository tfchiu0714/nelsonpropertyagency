  <rect x="60" y="95" width="960" height="50" rx="10" fill="rgba(255,255,255,0.1)"/>
  <text x="540" y="128" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">📋 R20260516-01 · 麟祥街 Lun Chun Street</text>
  <rect x="60" y="165" width="960" height="902" rx="20" fill="#fff"/>
  <text x="540" y="225" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">455万麟祥街543呎｜不交吉才是「被动收入」的启动键？</text>
  <line x1="150" y1="250" x2="930" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <text x="540" y="295" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" fill="#475569" text-anchor="middle">HK$4,550,000 · 543呎 · 不交吉 · $8,379/呎</text>
  <rect x="100" y="315" width="880" height="1" fill="#e2e8f0"/>
  <text x="540" y="360" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="17" fill="#334155" text-anchor="middle">很多买家听到「不交吉」就犹豫，觉得看不见房子不放心。但换个角度：这是一套已经在运作的现金流机器。</text>
  <text x="100" y="410" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#0369a1">核心逻辑拆解：</text>
  <text x="100" y="448" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">买入即收租：产权交割当天起，现有租客的租金收入直接转入你手上。零空置期、零装修期、零中介放盘成本。</text>
    <text x="100" y="500" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">543呎大单位在新界西细户为主的市场属于稀缺供应，租客群体相对稳定优质。</text>
    <text x="100" y="552" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">折合呎价仅$8,379/呎，相比同区交吉盘存在约10-15%的流动性折价，但这个折价本身就是安全垫。</text>
    
  <rect x="100" y="582" width="880" height="1" fill="#e2e8f0"/>
  <text x="100" y="607" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#0369a1">📊 账目数据明细：</text>
  <text x="120" y="649" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 总价：$4,550,000</text>
    <text x="120" y="681" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 首套房印花税：$100</text>
    <text x="120" y="713" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 7成按揭首期(Tier 1)：$1,365,000</text>
    <text x="120" y="745" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 月供估算(30年@3.5%)：约$14,300/月</text>
    <text x="120" y="777" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#334155">• 租金覆盖估算：约85-98%月供</text>
    
  <rect x="100" y="822" width="880" height="1" fill="#e2e8f0"/>
  <text x="540" y="872" font-family="'Noto Sans SC','Segoe UI',sans-serif" font-size="15" fill="#475569" text-anchor="middle">适合手头有较大首付、追求稳定现金流而非短期转售的防御型买家。不交吉折价本身就是进入安全边际。</text>
